# Local development stack only. Do not use this Compose file as a production deployment manifest.
name: campus-circle-dev

services:
  mysql:
    image: mysql:8.0
    container_name: campus_dev_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_circle
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucampus", "-pcampus"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.46.0
    container_name: campus_dev_meilisearch
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: campus_dev_backend
    environment:
      APP_ENV: dev
      MYSQL_DSN: campus:campus@tcp(mysql:3306)/campus_circle?charset=utf8mb4&parseTime=True&loc=Local
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      ALLOW_MOCK_WECHAT_LOGIN: "false"
      TENCENT_IM_SDK_APP_ID: ${TENCENT_IM_SDK_APP_ID:?TENCENT_IM_SDK_APP_ID is required}
      TENCENT_IM_SECRET_KEY: ${TENCENT_IM_SECRET_KEY:?TENCENT_IM_SECRET_KEY is required}
      TENCENT_IM_ADMIN_USER: ${TENCENT_IM_ADMIN_USER:?TENCENT_IM_ADMIN_USER is required}
      TENCENT_IM_REST_ENDPOINT: https://console.tim.qq.com
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_INDEX: products
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID is required}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY is required}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET is required}
      COS_REGION: ${COS_REGION:?COS_REGION is required}
      COS_APP_ID: ${COS_APP_ID:?COS_APP_ID is required}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required}
      WECHAT_CALLBACK_TOKEN: ${WECHAT_CALLBACK_TOKEN:?WECHAT_CALLBACK_TOKEN is required}
      WECHAT_API_BASE: https://api.weixin.qq.com
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: campus_dev_admin
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  mysql_data:
  meili_data:
