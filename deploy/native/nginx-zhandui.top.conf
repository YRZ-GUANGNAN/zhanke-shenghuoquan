# 管理后台独立域名配置。
#
# 这份配置只在 /etc/letsencrypt/live/zhandui.top/ 证书签发成功后启用。
# 证书签发前先只启用下方 HTTP server，让 ACME challenge 可达；旧的
# nginx-zhanduiwang.top.conf 在整个迁移窗口内保持不变。

server {
    listen 80;
    listen [::]:80;
    server_name zhandui.top;

    access_log /var/log/nginx/campus-admin-domain.access.log campus buffer=32k flush=5s;
    error_log /var/log/nginx/campus-admin-domain.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://zhandui.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhandui.top;

    ssl_certificate /etc/letsencrypt/live/zhandui.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhandui.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CAMPUS_ADMIN_DOMAIN_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/campus-admin-zhandui/current;
    index index.html;

    client_max_body_size 2m;
    client_body_timeout 15s;
    send_timeout 30s;

    access_log /var/log/nginx/campus-admin-domain.access.log campus buffer=32k flush=5s;
    error_log /var/log/nginx/campus-admin-domain.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /version {
        proxy_pass http://127.0.0.1:8080/version;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_redirect off;
        proxy_intercept_errors off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
