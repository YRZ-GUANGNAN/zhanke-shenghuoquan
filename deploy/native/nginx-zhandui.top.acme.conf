# 证书签发前的过渡配置。
# 只允许 ACME challenge，避免在证书不存在时加载 HTTPS server block。
server {
    listen 80;
    listen [::]:80;
    server_name zhandui.top;

    access_log /var/log/nginx/campus-admin-domain.access.log campus buffer=32k flush=5s;
    error_log /var/log/nginx/campus-admin-domain.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
